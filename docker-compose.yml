version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: autonomous_finops_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production # Mematikan kebocoran RAM dari mode testing
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Jakarta # Wajib untuk akurasi timestamp FinOps
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none # Menghemat storage, hanya simpan log error
    volumes:
      - n8n_finops_data:/home/node/.n8n
      - ./test-payloads:/data # Mounting folder lokal untuk testing PDF

volumes:
  n8n_finops_data:
